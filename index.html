<style>
:root{
  --bg:#05080d; --panel:#0b1118; --card:#0f1620; --card2:#0a0f15; --line:#1b2532; --line2:#2a3647; --line3:#36465b; --text:#dfe6ef; --soft:#b9c4d2; --soft2:#c9d2de; --mute:#7f8b9c;
  --up:#1fcf8f; --down:#f0605d; --gold:#f5c542; --blue:#4c9aff; --purple:#b388ff; --orange:#ff9f43; --aqua:#2dd4bf;
  --chart:#020407; --hdr:rgba(5,8,13,.92); --veil:rgba(5,8,13,.75); --on-gold:#1b1505; --on-up:#03140d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5f9; --panel:#eef2f7; --card:#ffffff; --card2:#f7f9fc; --line:#dde3ec; --line2:#c9d2de; --line3:#b7c2d1; --text:#131a26; --soft:#3d4757; --soft2:#2c3646; --mute:#5d6879;
  --up:#087f5b; --down:#c62f2c; --gold:#946200; --blue:#1a66c9; --purple:#7445cc; --orange:#b45000; --aqua:#0f766e;
  --chart:#ffffff; --hdr:rgba(243,245,249,.92); --veil:rgba(255,255,255,.85); --on-gold:#ffffff; --on-up:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.15;cursor:pointer}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.12em}
.theme{margin-left:auto;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.theme button{border:0;background:none;color:var(--mute);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;min-height:32px}
.theme button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.theme button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{margin-left:12px;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.bar{width:110px;height:5px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--gold));width:0;transition:width .4s}
main{display:grid;grid-template-columns:330px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 12px 40px;height:calc(100vh - 60px);overflow:auto;position:sticky;top:60px}
#search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--gold)}
.cat{margin:18px 4px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px;margin:2px 0}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:var(--line2)}
.item .ic{width:34px;height:34px;flex:none;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--acc)}
.item .ic svg{width:20px;height:20px}
.item b{display:block;font-size:14.5px;font-weight:600}
.item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.item .ok{margin-left:auto;color:var(--up);font-size:14px;opacity:0}
.item.seen .ok{opacity:1}
.empty{color:var(--mute);font-size:14px;padding:14px 6px}
#view{padding:18px 22px 60px;min-width:0}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;margin:0 6px 12px 0}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--mono);font-weight:800;letter-spacing:.03em;font-size:clamp(23px,4.4vw,36px);margin:4px 0 4px;text-transform:uppercase;line-height:1.15}
.lead{color:var(--soft);margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:760px}
.player{background:var(--chart);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:820px}
.cwrap{position:relative;cursor:pointer}
canvas.scene{display:block;width:100%;aspect-ratio:16/10}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay div{background:var(--veil);border:1px solid var(--line2);border-radius:999px;padding:12px 18px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em}
.caption{padding:12px 16px 4px;min-height:96px;border-top:1px solid var(--line)}
.caption .no{font-family:var(--mono);font-size:11px;color:var(--acc,var(--gold));letter-spacing:.14em}
.caption p{margin:5px 0 0;font-size:15.5px;line-height:1.45}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:40px;height:38px;padding:0 10px;font-family:var(--mono);font-size:14px;font-weight:700}
.cb:hover{border-color:var(--line3)}
#seek{flex:1;accent-color:var(--down);height:28px;min-width:0}
.row2{display:flex;align-items:center;gap:8px;padding:2px 12px 14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:none;border:1px solid var(--line);border-radius:999px;min-width:32px;height:30px;padding:0 9px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.chip.on{border-color:var(--acc,var(--gold));color:var(--acc,var(--gold))}
.chip.done{color:var(--text)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.speed button{border:0;background:var(--card);font-family:var(--mono);font-size:12px;font-weight:700;padding:0 10px;height:30px;color:var(--mute)}
.speed button.on{background:var(--acc,var(--gold));color:var(--bg)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;max-width:900px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.box p,.box li{font-size:14.5px;line-height:1.5;color:var(--soft2);margin:0}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.g h3{color:var(--up)}.box.y h3{color:var(--gold)}.box.b h3{color:var(--blue)}.box.r h3{color:var(--down)}
.box.g{border-top:3px solid var(--up)}.box.y{border-top:3px solid var(--gold)}.box.b{border-top:3px solid var(--blue)}.box.r{border-top:3px solid var(--down)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;max-width:900px}
.pn button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:14px;min-width:0}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.pn button:disabled{opacity:.35;cursor:default}
.home{max-width:900px}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}
.big{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:168px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:var(--acc)}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.big .bi{position:absolute;right:14px;top:14px;color:var(--acc);z-index:1}
.big .bi svg{width:54px;height:54px}
.big h2{font-family:var(--mono);font-weight:800;font-size:clamp(17px,1.6vw + 6px,21px);letter-spacing:.03em;text-transform:uppercase;margin:0 70px 8px 0;line-height:1.2;color:var(--acc)}
.big p{margin:0 0 14px;color:var(--soft);font-size:14.5px;line-height:1.45;max-width:80%}
.big .ft{margin-top:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.big .pb{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}.big .pb i{display:block;height:100%;background:var(--acc)}
.big .go{color:var(--acc);font-size:16px;font-weight:800}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:16px;max-width:900px}
.lc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.lc:hover{border-color:var(--acc)}
.lc canvas{width:88px;aspect-ratio:16/10;flex:none;border-radius:8px;border:1px solid var(--line);display:block}
.lc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--acc)}
.lc b{display:block;font-size:16px;margin:2px 0}
.lc span{display:block;font-size:13px;color:var(--mute);line-height:1.35}
.lc .ok{margin-left:auto;color:var(--up);font-size:18px;flex:none}
.lc .ok.no{color:var(--line3)}
.start{margin-top:16px;background:var(--up);color:var(--on-up);border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:760px}
.qbar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--gold)}
.qq{font-size:18px;font-weight:700;line-height:1.4;margin:6px 0 12px}
.qcv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.qcv canvas{display:block;width:100%;aspect-ratio:16/10}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--line3)}
.opt.ok{border-color:var(--up);background:rgba(31,207,143,.12)}
.opt.bad{border-color:var(--down);background:rgba(240,96,93,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.fb b{font-family:var(--mono)}
.fb.ok b{color:var(--up)}.fb.bad b{color:var(--down)}
.qnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qnav button{flex:1;min-width:140px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.qnav .main{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.score{font-family:var(--mono);font-size:54px;font-weight:800;margin:6px 0}
.rep{display:grid;gap:8px;margin-top:10px}
.rep button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.foot{color:var(--mute);font-size:12px;margin-top:26px;max-width:900px;line-height:1.5}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  #nav{display:none}
  #view{padding:14px 12px 50px}
  .bar{width:64px}
  .theme button .tl{display:none}
  .theme button{padding:6px 9px}
  .brand small{display:none}
  .brand{font-size:13.5px}
  header{padding:10px 12px;gap:10px}
  .prog{margin-left:4px}
  .caption p{font-size:15px}
}
</style>
</head>

<script>
"use strict";
/* ================= Zeichen-Werkzeuge ================= */
const W=480,H=300;
const MONO="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace";
const THEMES={
 dark:{sky1:'#07101d',sky2:'#132238',storm1:'#05080d',storm2:'#141c28',ground:'#1d3324',ground2:'#264430',earth:'#3b2b1f',earth2:'#2b1f16',rock:'#55443a',sea:'#0f4c74',sea2:'#06263f',
  cloud:'#d5dde7',cloud2:'#7b8798',cloudLine:'rgba(255,255,255,.18)',text:'#e6ecf3',mute:'#8c98a9',grid:'rgba(255,255,255,.08)',pillBg:'rgba(2,4,7,.86)',

 light:{sky1:'#a9cdef',sky2:'#e6f1fb',storm1:'#5d6878',storm2:'#9aa6b5',ground:'#8dbb73',ground2:'#6f9f58',earth:'#b48b62',earth2:'#9a7350',rock:'#8f7461',sea:'#3a8cc6',sea2:'#1d5f91',
  cloud:'#ffffff',cloud2:'#aab4c2',cloudLine:'rgba(19,26,38,.22)',text:'#131a26',mute:'#5d6879',grid:'rgba(19,26,38,.08)',pillBg:'rgba(255,255,255,.95)',
  gold:'#946200',up:'#087f5b',down:'#c62f2c',blue:'#1a66c9',purple:'#7445cc',orange:'#b45000',aqua:'#0f766e',lava:'#e8470e',magma:'#f07a1a',sun:'#f6b800',
  mantle:'#c2461f',mantle2:'#ec7a2f',core:'#f5b34a',inner:'#fff3c4',house:'#ffffff',roof:'#b7412c',wall2:'#9aa6b5',leaf:'#2e8b4e',trunk:'#7a5434',flash:'#ffffff',bolt:'#fff59a',boltGlow:'#7445cc'}};
const K=Object.assign({},THEMES.dark);
let THEME='dark';
function setCanvasTheme(t){THEME=t;Object.assign(K,THEMES[t]||THEMES.dark);}
let X=null,QUIZ=false;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const P=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const Lp=(t,a,b)=>clamp((t-a)/(b-a));

const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function hexA(hex,a){if(hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function fmt(n,d=0){return Number(n).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:d});}

function bg(c1,c2){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fillRect(0,0,W,H);}
function rectF(x,y,w,h,c,a=1){X.globalAlpha=a;X.fillStyle=c;X.fillRect(x,y,w,h);X.globalAlpha=1;}
function rrect(x,y,w,h,r,fill,stroke,lw=1.5,a=1){X.globalAlpha=a;X.beginPath();X.roundRect?X.roundRect(x,y,w,h,r):X.rect(x,y,w,h);if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke();}X.globalAlpha=1;}
function circ(x,y,r,c,a=1){if(r<=0||a<=0)return;X.globalAlpha=a;X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,7);X.fill();X.globalAlpha=1;}
function ring(x,y,r,c,w=2,a=1,dash){if(r<=0||a<=0)return;X.globalAlpha=a;X.strokeStyle=c;X.lineWidth=w;if(dash)X.setLineDash(dash);X.beginPath();X.arc(x,y,r,0,7);X.stroke();X.setLineDash([]);X.globalAlpha=1;}
function ell(x,y,rx,ry,c,a=1,rot=0){if(rx<=0||ry<=0||a<=0)return;X.globalAlpha=a;X.fillStyle=c;X.beginPath();X.ellipse(x,y,rx,ry,rot,0,7);X.fill();X.globalAlpha=1;}
function poly(pts,fill,stroke,lw=2,a=1){if(a<=0)return;X.globalAlpha=a;X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.lineJoin='round';X.stroke();}X.globalAlpha=1;}
function path(pts,c,w=2,a=1,dash){if(a<=0||pts.length<2)return;X.globalAlpha=a;X.strokeStyle=c;X.lineWidth=w;X.lineJoin='round';X.lineCap='round';if(dash)X.setLineDash(dash);X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.setLineDash([]);X.globalAlpha=1;}
function line(x1,y1,x2,y2,c,w=2,a=1,dash){path([[x1,y1],[x2,y2]],c,w,a,dash);}
function head(x,y,ang,c,s=9,a=1){X.globalAlpha=a;X.fillStyle=c;X.beginPath();X.moveTo(x,y);X.lineTo(x-s*Math.cos(ang-.45),y-s*Math.sin(ang-.45));X.lineTo(x-s*Math.cos(ang+.45),y-s*Math.sin(ang+.45));X.closePath();X.fill();X.globalAlpha=1;}
function arrow(x1,y1,x2,y2,c,w=3,p=1,a=1){if(p<=0||a<=0)return;const x=x1+(x2-x1)*p,y=y1+(y2-y1)*p,ang=Math.atan2(y2-y1,x2-x1);line(x1,y1,x-Math.cos(ang)*4,y-Math.sin(ang)*4,c,w,a);head(x,y,ang,c,w*2.6+3,a);}
/* Pfeil entlang Punktliste (Teil p) */
function arrowPath(pts,c,w=3,p=1,a=1){if(p<=0||a<=0)return;const n=pts.length-1,k=p*n,i=Math.min(n-1,Math.floor(k)),f=k-i,sub=pts.slice(0,i+1);const e=[mix(pts[i][0],pts[i+1][0],f),mix(pts[i][1],pts[i+1][1],f)];sub.push(e);path(sub,c,w,a);const b=sub[sub.length-2];head(e[0],e[1],Math.atan2(e[1]-b[1],e[0]-b[0]),c,w*2.6+3,a);}
/* Kreis-Pfeil (Rotation) */
function rotArrow(x,y,rx,ry,a0,span,c,w=2.5,a=1,dir=1){if(a<=0)return;const pts=[];for(let i=0;i<=24;i++){const an=a0+dir*span*i/24;pts.push([x+rx*Math.cos(an),y+ry*Math.sin(an)]);}path(pts,c,w,a);const e=pts[24],b=pts[22];head(e[0],e[1],Math.atan2(e[1]-b[1],e[0]-b[0]),c,w*2.6+3,a);}
function txt(x,y,s,c,size=12,align='center',weight=700,a=1){if(a<=0)return;X.globalAlpha=a;X.fillStyle=c;X.font=`${weight} ${size}px ${MONO}`;X.textAlign=align;X.textBaseline='middle';X.fillText(s,x,y);X.globalAlpha=1;}
/* Beschriftung als Pille – wird im Quiz ausgeblendet, bleibt immer im Bild */
function pill(x,y,s,c,a=1,align='c',size=12.5){if(QUIZ||a<=0)return;X.font=`800 ${size}px ${MONO}`;const tw=X.measureText(s).width+16,h=size+10;let l=align==='l'?x:align==='r'?x-tw:x-tw/2;l=clamp(l,4,W-4-tw);const t=clamp(y-h/2,4,H-4-h);X.globalAlpha=a;rrect(l,t,tw,h,h/2,K.pillBg,c,1.6,a);X.globalAlpha=a;X.fillStyle=c;X.textAlign='left';X.textBaseline='middle';X.fillText(s,l+8,t+h/2+.5);X.globalAlpha=1;}
function glow(fn,c,b=14){X.save();X.shadowColor=c;X.shadowBlur=b;fn();X.restore();}
/* Wolke aus Kreisen */
function cloud(x,y,w,h,c,a=1,dark){if(a<=0||w<=0)return;X.globalAlpha=a;const g=X.createLinearGradient(0,y-h,0,y+h*.4);g.addColorStop(0,c);g.addColorStop(1,dark||c);X.fillStyle=g;X.beginPath();const n=Math.max(3,Math.round(w/26)),re=h*.32;for(let i=0;i<n;i++){const f=(i+.5)/n,cx=x-w/2+re+(w-2*re)*f,r=h*(.42+.38*Math.sin(Math.PI*f))*(.85+.3*rnd(i+w)),cy=y-h*.18*Math.sin(Math.PI*f);X.moveTo(cx+r,cy);X.arc(cx,cy,r,0,7);}X.moveTo(x-w/2+re*2,y);X.arc(x-w/2+re,y,re,0,7);X.moveTo(x+w/2,y);X.arc(x+w/2-re,y,re,0,7);X.rect(x-w/2+re,y-h*.1,w-2*re,h*.42);X.fill();X.globalAlpha=1;}
/* Gewitterturm: base = Unterkante, top = Oberkante, w = Breite, anvil = Ambossbreite */
function cbCloud(x,base,top,w,anvil,a=1){if(a<=0)return;X.globalAlpha=a;const g=X.createLinearGradient(0,top,0,base);g.addColorStop(0,K.cloud);g.addColorStop(1,K.cloud2);X.fillStyle=g;X.beginPath();const hgt=base-top;
 X.moveTo(x-w/2,base);if(X.roundRect)X.roundRect(x-w/2-6,top+18,w+12,Math.max(0,hgt-18),[0,0,10,10]);else X.rect(x-w/2,top+18,w,Math.max(0,hgt-18));
 const rows=Math.max(1,Math.round(hgt/26));for(let i=1;i<=rows;i++){const yy=base-hgt*i/rows+4,wob=6*Math.sin(i*1.7);[[x-w/2,yy],[x+w/2,yy]].forEach(([cx,cy],j)=>{const r=16+5*rnd(i*3+j);X.moveTo(cx+r+(j?wob:-wob),cy);X.arc(cx+(j?wob:-wob),cy,r,0,7);});}
 const tn=Math.max(2,Math.round(w/30));for(let i=0;i<tn;i++){const cx=x-w/2+w*(i+.5)/tn,r=20+6*rnd(i+7);X.moveTo(cx+r,top+16);X.arc(cx,top+16,r,0,7);}
 if(anvil>w){X.moveTo(x-anvil/2,top+2);X.ellipse(x,top+8,anvil/2,16,0,0,7);}
 X.fill();X.globalAlpha=1;}
function bolt(x1,y1,x2,y2,seed,p=1,w=3,a=1,jag=16){if(p<=0||a<=0)return;const n=12,pts=[];for(let i=0;i<=n;i++){const f=i/n;const off=(i===0||i===n)?0:(rnd(seed+i)-.5)*jag*2;pts.push([mix(x1,x2,f)+off,mix(y1,y2,f)+off*.25]);}
 const k=p*n,i=Math.min(n-1,Math.floor(k)),f=k-i,sub=pts.slice(0,i+1);sub.push([mix(pts[i][0],pts[i+1][0],f),mix(pts[i][1],pts[i+1][1],f)]);
 X.save();X.shadowColor=K.boltGlow;X.shadowBlur=16;path(sub,K.bolt,w,a);X.restore();path(sub,'#ffffff',Math.max(1,w*.4),a);return pts;}
function rain(x1,x2,y1,y2,t,c,a=.6,n=26,seed=1){if(a<=0)return;for(let i=0;i<n;i++){const x=x1+(x2-x1)*rnd(i+seed),sp=.25+.1*rnd(i+seed+9),y=y1+((t*sp+rnd(i+seed+3)*999)%(y2-y1));line(x,y,x-3,y+10,c,1.5,a);}}

 if(dmg<4.5){const wl=dmg>3.5?.5:1;rectF(x-w/2,y-h*wl,w,h*wl,K.house,a);rectF(x-w/2,y-h*wl,w,h*wl,K.wall2,a*.25);if(wl===1){rectF(x-w/4,y-h*.55,w*.18,h*.3,K.sea2,a);rectF(x+w*.08,y-h*.55,w*.18,h*.3,K.sea2,a);rectF(x-w*.06,y-h*.42,w*.14,h*.42,K.trunk,a);}}
 else rectF(x-w/2,y-3*s,w,3*s,K.wall2,a);
 if(dmg<1.5)poly([[x-w/2-3*s,y-h],[x+w/2+3*s,y-h],[x,y-h-16*s]],K.roof,null,1,a);
 else if(dmg<2.5)poly([[x-w/2-3*s,y-h],[x,y-h],[x-w*.1,y-h-13*s]],K.roof,null,1,a);
 if(dmg>.5&&dmg<2.5){for(let i=0;i<3;i++)rectF(x-w/2+rnd(i+x)*w,y-h-6*s-rnd(i+3)*8*s,3*s,2*s,K.roof,a);}
 X.globalAlpha=1;}
function tree(x,y,s=1,bend=0,a=1,leaf=1){if(a<=0)return;line(x,y,x+bend*12*s,y-26*s,K.trunk,4*s,a);if(leaf>0){circ(x+bend*16*s,y-32*s,12*s*leaf,K.leaf,a);circ(x+bend*14*s-7*s,y-26*s,9*s*leaf,K.leaf,a);circ(x+bend*14*s+7*s,y-27*s,9*s*leaf,K.leaf,a);}}
function person(x,y,c,s=1,a=1,run=0){if(a<=0)return;circ(x,y-22*s,4.5*s,c,a);line(x,y-17*s,x,y-8*s,c,3*s,a);const k=Math.sin(run)*5*s;line(x,y-8*s,x-k,y,c,2.6*s,a);line(x,y-8*s,x+k,y,c,2.6*s,a);line(x,y-15*s,x-k*.8-3*s,y-10*s,c,2.4*s,a);line(x,y-15*s,x+k*.8+3*s,y-10*s,c,2.4*s,a);}

function spiralArm(cx,cy,r0,r1,a0,turn,c,w,a,dir=-1){const pts=[];for(let j=0;j<=24;j++){const f=j/24,r=mix(r0,r1,f);pts.push([cx+Math.cos(a0+dir*turn*f)*r,cy+Math.sin(a0+dir*turn*f)*r]);}arrowPath(pts,c,w,1,a);}

 ()=>{const T=pick([20,25,30]),h=pick([500,1000,1500,2000]),r=T-h/100;return{q:`Am Boden hat die Luft ${T} °C. Ein Luftpaket steigt ${fmt(h)} m auf. Wie warm ist es dann ungefähr?`,opts:uniqOpts(`${fmt(r)} °C`,shuffle([`${fmt(T-h/10)} °C`,`${fmt(T)} °C`,`${fmt(r+5)} °C`,`${fmt(T+h/100)} °C`])),expl:`Aufsteigende (trockene) Luft kühlt um etwa 1 °C pro 100 m ab: ${T} − ${fmt(h/100)} = ${fmt(r)} °C.`,les:'aufwind'};},
 ()=>{const cats=[[1,119,153],[2,154,177],[3,178,208],[4,209,251],[5,252,290]],c=pick(cats),v=Math.round(mix(c[1],c[2],Math.random())/5)*5;const vv=clamp(v,c[1],c[2]);return{q:`Ein Hurrikan hat Windgeschwindigkeiten von ${vv} km/h. Welche Kategorie hat er auf der Saffir-Simpson-Skala?`,opts:uniqOpts(`Kategorie ${c[0]}`,shuffle([1,2,3,4,5].filter(k=>k!==c[0]).map(k=>`Kategorie ${k}`))),expl:`Kategorie ${c[0]} reicht von ${c[1]}${c[0]===5?' km/h aufwärts':' bis '+c[2]+' km/h'}.`,les:'saffir'};},
 ()=>{const d=pick([5,10,15,20,25]),km=d*8;return{q:`Zwischen P-Welle und S-Welle liegen am Seismographen ${d} Sekunden. Wie weit ist das Erdbeben ungefähr entfernt? (Faustregel: ca. 8 km pro Sekunde)`,opts:uniqOpts(`ca. ${fmt(km)} km`,shuffle([`ca. ${fmt(d*3)} km`,`ca. ${fmt(d*6)} km`,`ca. ${fmt(km*2)} km`,`ca. ${fmt(d)} km`])),expl:`${d} s × 8 km/s ≈ ${fmt(km)} km. Je größer der Abstand zwischen P und S, desto weiter weg ist das Beben.`,les:'wellen'};},
 ()=>{const two=Math.random()<.5;return{q:two?'Ein Erdbeben hat Magnitude 7, ein anderes Magnitude 5. Wie viel mehr Energie setzt das stärkere ungefähr frei?':'Ein Erdbeben hat Magnitude 6, ein anderes Magnitude 5. Wie viel mehr Energie setzt das stärkere ungefähr frei?',opts:two?['ca. 1.000-mal so viel','2-mal so viel','ca. 20-mal so viel','ca. 64-mal so viel']:['ca. 32-mal so viel','2-mal so viel','10-mal so viel','ca. 1.000-mal so viel'],expl:two?'Jede Stufe bringt ca. 32-mal mehr Energie: 32 × 32 ≈ 1.000.':'Eine Stufe mehr = 10-mal größerer Ausschlag, aber ca. 32-mal mehr Energie.',les:'magnitude'};},
 ()=>{const s=pick([30,45,60]),km=s/3;return{q:`Zwischen Blitz und Donner vergehen ${s} Sekunden. Wie weit ist das Gewitter weg – und bist du nach der 30/30-Regel sicher?`,opts:s<=30?[`${fmt(km)} km – du bist in Gefahr`,`${fmt(km)} km – du bist sicher`,`${fmt(s)} km – du bist sicher`,`${fmt(km/2)} km – du bist in Gefahr`]:[`${fmt(km)} km – noch etwas Abstand, aber aufmerksam bleiben`,`${fmt(km)} km – akute Gefahr, Blitz direkt über dir`,`${fmt(s)} km – völlig egal`,`${fmt(km/3,1)} km – akute Gefahr`],expl:`${s} ÷ 3 = ${fmt(km)} km. Unter 30 Sekunden (10 km) solltest du sofort Schutz suchen.`,les:'donner'};}
];
function buildQuiz(){const know=shuffle(QK).slice(0,5).map(q=>({...q,opts:q.opts.slice()}));
 const calc=shuffle(CALC).slice(0,2).map(f=>f());
 const imgL=shuffle(LES.filter(l=>l.qimg!==false)).slice(0,3).map(l=>{const others=shuffle(LES.filter(o=>o!==l&&o.qimg!==false)).slice(0,3).map(o=>o.title);return{q:'Was ist hier zu sehen?',img:l.id,opts:[l.title,...others],expl:`Das ist „${l.title}“: ${l.sub}.`,les:l.id};});
 return shuffle([...know,...calc,...imgL]).map(q=>{const right=q.opts[0];const opts=shuffle(q.opts);return{...q,opts,right};});}
let QZ=null;
function renderQuiz(){if(!QZ){view.innerHTML=`<button class="back" data-go="">← Startseite</button><div class="kicker">Quiz</div><h1>Teste dein Wissen</h1><p class="lead">10 zufällige Fragen aus allen Bereichen: Bilder erkennen, Wissen und kleine Rechenaufgaben. Bestwert: <b>${BEST}/10</b></p><button class="start" id="qstart">▶ Quiz starten</button>`;
  document.getElementById('qstart').onclick=()=>{QZ={qs:buildQuiz(),i:0,score:0,wrong:[],ans:false};renderQuiz();};return;}
 if(QZ.i>=QZ.qs.length){const sc=QZ.score;const nb=sc>BEST;if(nb){BEST=sc;store.set('ng-best',BEST);}const rep=[...new Set(QZ.wrong)];
  view.innerHTML=`<button class="back" data-go="">← Startseite</button><div class="qcard"><div class="kicker">Ergebnis</div><div class="score">${sc} / 10</div><p class="lead">${nb?'🏆 Neuer Bestwert!':`Bestwert: ${BEST}/10`} ${sc>=9?'Ausgezeichnet!':sc>=7?'Sehr gut!':sc>=5?'Gut – da geht noch mehr.':'Schau dir die Lektionen nochmal an.'}</p>
  ${rep.length?`<div class="kicker">Diese Lektionen wiederholen</div><div class="rep">${rep.map(id=>`<button data-go="l-${id}">↻ ${esc(lesOf(id).title)} <span style="color:var(--mute)">· ${esc(areaOf(lesOf(id).area).name)}</span></button>`).join('')}</div>`:'<p>Alles richtig – keine Lektion zum Wiederholen. 🎉</p>'}
  <div class="qnav"><button class="main" id="qagain">↻ Nochmal spielen</button><button data-go="">Startseite</button></div></div>`;
  document.getElementById('qagain').onclick=()=>{QZ={qs:buildQuiz(),i:0,score:0,wrong:[],ans:false};renderQuiz();};return;}
 const q=QZ.qs[QZ.i];
 view.innerHTML=`<button class="back" id="qquit">← Quiz beenden</button><div class="qcard"><div class="qbar"><i style="width:${QZ.i*10}%"></i></div><div class="kicker">Frage ${QZ.i+1} / 10 · Punkte ${QZ.score}</div><p class="qq">${esc(q.q)}</p>
 ${q.img?`<div class="qcv"><canvas id="qcv"></canvas></div>`:''}<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o)}</button>`).join('')}</div><div id="qfb"></div></div>`;
 document.getElementById('qquit').onclick=()=>{QZ=null;location.hash='';};
 if(q.img){const L=lesOf(q.img);drawScene(document.getElementById('qcv'),L,L.qt!=null?L.qt:L.total,true);}
 view.querySelector('.opts').onclick=e=>{const b=e.target.closest('[data-o]');if(!b||QZ.ans)return;QZ.ans=true;const ok=q.opts[+b.dataset.o]===q.right;if(ok)QZ.score++;else QZ.wrong.push(q.les);
  view.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const o=q.opts[+x.dataset.o];if(o===q.right)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
  const L=lesOf(q.les);document.getElementById('qfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✓ Richtig!':'✗ Leider falsch.'}</b> ${ok?'':`Richtig ist: <b>${esc(q.right)}</b>. `}${esc(q.expl)}</div><div class="qnav"><button id="qles">📺 Lektion: ${esc(L.title)}</button><button class="main" id="qnext">${QZ.i===9?'Ergebnis →':'Weiter →'}</button></div>`;
  document.getElementById('qnext').onclick=()=>{QZ.i++;QZ.ans=false;renderQuiz();window.scrollTo(0,0);};
  document.getElementById('qles').onclick=()=>{location.hash='l-'+q.les;};};}

/* ================= Navigation ================= */
function renderNav(){const q=(document.getElementById('search').value||'').trim().toLowerCase(),cur=location.hash.slice(1);let h='',hits=0;
 AREAS.forEach(a=>{const ls=LES.filter(l=>l.area===a.id&&(!q||(l.title+' '+l.sub+' '+l.box.was+' '+l.steps.map(s=>s.text).join(' ')).toLowerCase().includes(q)));if(!ls.length)return;hits+=ls.length;
  h+=`<div class="cat">${esc(a.name)}</div>`+ls.map(l=>`<button class="item ${SEEN.has(l.id)?'seen':''} ${cur==='l-'+l.id?'on':''}" data-go="l-${l.id}" style="--acc:${accVar(a)}"><span class="ic">${ICONS[a.id]}</span><span><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></span><span class="ok">✓</span></button>`).join('');});
 if(!q||'quiz'.includes(q))h+=`<div class="cat">Quiz</div><button class="item ${cur==='quiz'?'on':''}" data-go="quiz" style="--acc:var(--down)"><span class="ic">${ICONS.quiz}</span><span><b>Quiz</b><span>Bestwert ${BEST}/10</span></span></button>`;
 document.getElementById('list').innerHTML=hits||!q?h:`<div class="empty">Keine Lektion gefunden.</div>`;}
document.getElementById('search').oninput=renderNav;
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b||b.disabled)return;const g=b.dataset.go;if(g==='quiz'&&location.hash!=='#quiz')QZ=null;if(location.hash.slice(1)===g)route();else location.hash=g;});
function route(){stopPlayer();view.style.removeProperty('--acc');const h=location.hash.slice(1);
 if(h==='quiz')renderQuiz();else if(h.startsWith('b-'))renderArea(h.slice(2));else if(h.startsWith('l-'))renderLesson(h.slice(2));else renderHome();
 renderNav();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* ================= Hell / Dunkel ================= */
let MODE=(()=>{try{return localStorage.getItem('kompass-theme')||'dark';}catch(e){return 'dark';}})();
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function applyTheme(){const t=MODE==='auto'?(mq&&mq.matches?'light':'dark'):MODE;document.documentElement.setAttribute('data-theme',t);setCanvasTheme(t);
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===MODE));
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f3f5f9':'#05080d';
 if(PL&&PL.redraw)PL.redraw();drawThumbs();const qc=document.getElementById('qcv');if(qc&&QZ&&QZ.qs[QZ.i]&&QZ.qs[QZ.i].img){const L=lesOf(QZ.qs[QZ.i].img);drawScene(qc,L,L.qt!=null?L.qt:L.total,true);}}
document.querySelectorAll('.theme button').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;try{localStorage.setItem('kompass-theme',MODE);}catch(e){}applyTheme();});
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(MODE==='auto')applyTheme();});
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(PL&&PL.redraw)PL.redraw();drawThumbs();},120);});
applyTheme();updProg();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(PL&&PL.redraw)PL.redraw();drawThumbs();});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
